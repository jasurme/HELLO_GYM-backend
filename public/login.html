<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · BinaryFit</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="hero">
  <main class="container py-5 d-flex flex-column align-items-center">
    <a class="navbar-brand d-flex align-items-center text-white fs-4 fw-bold mb-4 text-decoration-none" href="/">
      <span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span>BinaryFit
    </a>
    <div class="card auth-card w-100 text-body">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Welcome back</h1>
        <p class="text-secondary mb-4">Log in as a member, trainer or administrator.</p>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email or username</label>
            <input class="form-control" id="email" name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com or @username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="alert alert-danger d-none py-2" id="loginError"></div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="text-center small mt-3 mb-0">New here? <a href="/register.html">Create a member account</a></p>
      </div>
    </div>

    <div class="card auth-card w-100 mt-3 text-body">
      <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="small fw-semibold"><i class="bi bi-person-video3 me-1 text-brand"></i>Demo accounts</span>
          <span class="small text-secondary">password <code>Gym12345!</code></span>
        </div>
        <div class="list-group list-group-flush small" id="demoAccounts"></div>
      </div>
    </div>
  </main>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
